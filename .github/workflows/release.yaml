#
# Automatically tag a merge with main.
#

name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  release:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: "0" # make sure we get all commits!

      - name: Bump version and push tag
        id: bump
        uses: anothrNick/github-tag-action@1.52.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: release
          WITH_V: true

      # Publishes the WebAssembly renderer for the new version to
      # https://assets.invopop.com/gobl.html/<version>/ (the "assets" R2
      # bucket). This runs here because tags pushed with GITHUB_TOKEN don't
      # start other workflows. A version is complete once its manifest.txt,
      # uploaded last, exists; complete versions are immutable and never
      # overwritten, while a partial upload is finished by the next run.
      - name: Set up Go
        if: steps.bump.outputs.new_tag != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CDN assets
        if: steps.bump.outputs.new_tag != ''
        run: scripts/cdn-dist.sh dist "${{ steps.bump.outputs.new_tag }}"

      - name: Publish CDN assets
        if: steps.bump.outputs.new_tag != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the checksums newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: gobl.html/${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          if aws s3api head-object --endpoint-url "$ENDPOINT" --bucket assets --key "$PREFIX/manifest.txt" >/dev/null 2>&1; then
            echo "$PREFIX is already published."
            exit 0
          fi
          # The manifest lists every file in the bundle and goes up last, so
          # its presence means the whole version is there.
          (cd dist && find . -type f | sed 's|^\./||' | sort) > manifest.txt
          upload() {
            aws s3 cp "$1" "s3://assets/$PREFIX/$2" \
              --endpoint-url "$ENDPOINT" \
              --content-type "$3" \
              --cache-control "public, max-age=31536000, immutable"
          }
          while read -r rel; do
            case "$rel" in
              *.wasm) type=application/wasm ;;
              *.js) type="text/javascript; charset=utf-8" ;;
              *.css) type="text/css; charset=utf-8" ;;
              *) echo "No content type for $rel" >&2; exit 1 ;;
            esac
            upload "dist/$rel" "$rel" "$type"
          done < manifest.txt
          upload manifest.txt manifest.txt "text/plain; charset=utf-8"
          echo "Published https://assets.invopop.com/$PREFIX/"
